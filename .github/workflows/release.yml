# Runs on every push to main. The version comes from src/ZapperRadio/ZapperRadio.csproj;
# when no release exists yet for that version, the Velopack installers and update packages are built
# and published as a new GitHub release tagged v<version>. Other commits only run the tests.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/ZapperRadio.Core.Tests -c Release

      - name: Determine version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content src/ZapperRadio/ZapperRadio.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No <Version> found in ZapperRadio.csproj' }
          gh release view "v$version" 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) { Write-Host "Release v$version already exists, skipping." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$(-not $exists)".ToLower() >> $env:GITHUB_OUTPUT

      # Keep the version in step with the Velopack package in ZapperRadio.csproj.
      - name: Install vpk
        if: steps.version.outputs.publish == 'true'
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Build installers
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          foreach ($arch in 'x64', 'arm64') {
              # Installed apps update from the feed of the previous release, and the delta package is made against it.
              # The first Velopack release has no previous one, which is not an error.
              vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel "win-$arch" --outputDir artifacts/velopack --token '${{ github.token }}'
              if ($LASTEXITCODE -ne 0) { Write-Warning "No previous release to download for $arch."; $global:LASTEXITCODE = 0 }

              ./build-installer.ps1 -Version $version -Arch $arch
              # Versionless names keep the README's "latest release" download links stable.
              Copy-Item "artifacts/velopack/ZapperRadioApp-win-$arch-Setup.exe" "artifacts/release/ZapperRadio-$arch-Setup.exe"
          }

      # The Setup programs are what people download. The packages and feeds are what installed apps update from:
      # only this version's packages, since the earlier ones are attached to their own releases.
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ZapperRadio v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/release/ZapperRadio-x64-Setup.exe
            artifacts/release/ZapperRadio-arm64-Setup.exe
            artifacts/velopack/*-${{ steps.version.outputs.version }}-*.nupkg
            artifacts/velopack/releases.*.json
            artifacts/velopack/RELEASES-*
